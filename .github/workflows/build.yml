name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        apple_services: [NO, YES]
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build for iPad (no signing)
        run: |
          set +e
          xcodebuild -project FamilyScreen.xcodeproj -target FamilyScreen \
            -sdk iphoneos -configuration Debug \
            APPLE_SERVICES=${{ matrix.apple_services }} \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          status=$?
          grep -E "error:|warning: .*FamilyScreen/|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -150
          exit $status
